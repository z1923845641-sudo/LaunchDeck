name: build
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild src/LaunchDeck/LaunchDeck.csproj /p:Configuration=Release /restore
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LaunchDeck
          path: src/LaunchDeck/bin/Release/net48/
